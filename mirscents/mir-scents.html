<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIR SCENTS — Премиальный парфюм</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07000f;
  --card:#110a20;
  --card-2:#180f2b;
  --purple:#8b2fff;
  --purple-soft:#a765ff;
  --gold:#f5c842;
  --line:rgba(139,47,255,.20);
  --text:#efe9f8;
  --muted:#9186a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#03000a;color:var(--text);font-family:Montserrat,system-ui,sans-serif}
body{display:flex;justify-content:center;min-height:100vh}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font-family:inherit}
#app{width:100%;max-width:430px;min-height:100vh;position:relative;background:var(--bg);overflow:hidden;
  box-shadow:0 0 90px rgba(139,47,255,.14)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(620px 480px at -18% 42%,rgba(101,26,190,.16),transparent 66%),
             radial-gradient(700px 520px at 50% 104%,rgba(139,47,255,.14),transparent 64%)}

/* ============ ХЕДЕР + ВЕРХНЯЯ НАВИГАЦИЯ ============ */
.header{position:sticky;top:0;z-index:60;padding:12px 14px 11px;background:rgba(6,0,13,.95);
  backdrop-filter:blur(18px);border-bottom:1px solid rgba(139,47,255,.12)}
.hrow{display:flex;align-items:center;gap:12px}
.logo{flex:1;font-weight:800;font-size:16px;letter-spacing:.045em;white-space:nowrap}
.logo i{font-style:normal;color:#fff}
.logo b{font-weight:800;color:var(--purple-soft)}
.nav{display:flex;gap:5px;margin-top:11px}
.nav button{flex:1;min-width:0;padding:9px 3px;border-radius:99px;font-size:9.5px;font-weight:700;
  letter-spacing:.055em;text-transform:uppercase;color:#7d7195;text-align:center;transition:.16s;
  border:1px solid transparent}
.nav button:not(.on){border-color:rgba(139,47,255,.16);background:rgba(17,10,32,.7)}
.nav button.on{background:var(--purple);color:#fff;box-shadow:0 3px 14px rgba(139,47,255,.5)}
.nav button.sale{color:var(--gold)}
.nav button.sale.on{color:#2a1a00;background:var(--gold);box-shadow:0 3px 14px rgba(245,200,66,.4)}
.iconbtn{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;position:relative;transition:.16s}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:21px;height:21px;stroke:var(--text);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cbadge{position:absolute;top:-2px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--purple);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;
  border:2px solid var(--bg);box-shadow:0 0 10px rgba(139,47,255,.8)}
.back{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;flex:1}
.back svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.screen{position:relative;z-index:1;padding-bottom:34px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ ГЕРОЙ ============ */
.hero{position:relative;height:326px;overflow:hidden}
.hero-bg{position:absolute;inset:0}
.hero-bg svg{width:100%;height:100%;display:block}
.hero-bg img{width:100%;height:100%;object-fit:cover;display:block}
.hero-veil{position:absolute;inset:0;
  background:linear-gradient(88deg,rgba(7,0,15,.94) 6%,rgba(7,0,15,.72) 40%,rgba(7,0,15,.12) 74%),
             linear-gradient(0deg,var(--bg) 1%,rgba(7,0,15,.35) 26%,transparent 58%)}
.hero-txt{position:absolute;left:20px;right:20px;bottom:26px}
.hero-txt em{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold);margin-bottom:11px}
.hero-txt h1{margin:0;font-size:33px;line-height:1.02;font-weight:800;letter-spacing:-.6px;text-transform:uppercase}
.hero-txt h1 span{display:block;color:var(--purple-soft);text-shadow:0 0 34px rgba(139,47,255,.6)}
.hero-cta{margin-top:20px;display:inline-flex;align-items:center;gap:11px;padding:14px 24px;border-radius:13px;
  background:linear-gradient(96deg,var(--purple),#6a1fd0);font-size:11px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;box-shadow:0 10px 28px rgba(139,47,255,.45);transition:.16s}
.hero-cta:active{transform:scale(.97)}
.hero-cta svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ============ ПОЛОСА ДОВЕРИЯ ============ */
.trust{display:grid;grid-template-columns:repeat(3,1fr);
  background:linear-gradient(180deg,rgba(24,15,43,.9),rgba(17,10,32,.6));
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trust div{padding:15px 6px;text-align:center;position:relative}
.trust div + div::before{content:"";position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--line)}
.trust svg{width:19px;height:19px;stroke:var(--purple-soft);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
.trust b{display:block;font-size:9.5px;font-weight:600;letter-spacing:.03em;color:#b9acd2;line-height:1.35}

/* ============ ЗАГОЛОВОК СЕКЦИИ ============ */
.sect{padding:26px 18px 15px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.sect em{display:block;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--purple-soft);margin-bottom:7px}
.sect h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.2px;text-transform:uppercase}
.sect > span{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;padding-bottom:3px}

/* ============ КАРТОЧКА ТОВАРА ============ */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.pcard{position:relative;border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--line);transition:.18s}
.pcard:active{transform:scale(.978);border-color:rgba(139,47,255,.5)}
.pshot{position:relative;height:186px;overflow:hidden;background:#0b0518}
.pshot > *{width:100%;height:100%;display:block}
.pshot img{object-fit:cover}
.pshot::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 40%,transparent 44%,rgba(4,0,10,.55) 100%),
             linear-gradient(0deg,rgba(17,10,32,.9),transparent 34%)}
.badge{position:absolute;top:10px;left:10px;z-index:3;padding:5px 10px;border-radius:99px;
  font-size:9px;font-weight:800;letter-spacing:.07em}
.badge.p{background:var(--purple);color:#fff;box-shadow:0 3px 12px rgba(139,47,255,.55)}
.badge.g{background:var(--gold);color:#2a1a00;box-shadow:0 3px 12px rgba(245,200,66,.4)}
.pbody{padding:12px 12px 10px;display:flex;align-items:flex-end;gap:8px;flex:1}
.ptext{flex:1;min-width:0}
.pbrand{font-size:9px;letter-spacing:.06em;color:#8b7fa6;font-weight:600;margin-bottom:5px}
.pname{font-size:13.5px;font-weight:700;line-height:1.25;letter-spacing:-.1px;margin-bottom:7px}
.pold{display:block;font-size:10.5px;color:#665b7d;text-decoration:line-through;margin-bottom:2px}
.pprice{font-size:15px;font-weight:800;letter-spacing:-.3px;color:var(--purple-soft)}
.pprice.sale{color:var(--gold)}
.addbtn{margin:0 12px 12px;padding:11px 8px;border-radius:11px;
  background:linear-gradient(96deg,var(--purple),#6d21d4);
  font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 5px 16px rgba(139,47,255,.32);transition:.16s}
.addbtn:active{transform:scale(.95)}
.addbtn.done{background:linear-gradient(96deg,var(--gold),#e0a91e);color:#2a1a00;
  box-shadow:0 5px 16px rgba(245,200,66,.28)}
.addbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

/* ---- Транспортные компании ---- */
.carriers{padding:0 18px;display:flex;flex-direction:column;gap:9px}
.carrier{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:13px;width:100%;
  text-align:left;background:var(--card);border:1px solid var(--line);transition:.16s}
.carrier:active{transform:scale(.985)}
.carrier.on{border-color:var(--purple);background:linear-gradient(96deg,rgba(139,47,255,.15),var(--card));
  box-shadow:0 0 0 1px rgba(139,47,255,.28) inset}
.carrier .mark{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-size:8.5px;font-weight:800;letter-spacing:.02em;color:#fff}
.carrier .tx{flex:1;min-width:0}
.carrier .tx b{display:block;font-size:13px;font-weight:700;line-height:1.25}
.carrier .tx span{font-size:10.5px;color:var(--muted)}
.carrier .pr{text-align:right;flex:none}
.carrier .pr b{display:block;font-size:13.5px;font-weight:800;color:var(--gold);letter-spacing:-.2px}
.carrier .pr span{font-size:9.5px;color:var(--muted)}
.carrier .pr.wait b{color:#5d5273;font-size:10.5px;font-weight:600;letter-spacing:.04em}
.carrier .pr.load b{animation:sh 1.05s ease-in-out infinite}
@keyframes sh{0%,100%{opacity:.32}50%{opacity:1}}
.notice{margin:12px 18px 0;padding:12px 14px;border-radius:12px;display:flex;gap:10px;align-items:flex-start;
  background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.26);
  font-size:11.5px;line-height:1.55;color:#cfc0a0}
.notice svg{width:16px;height:16px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.notice b{color:var(--gold);font-weight:700}
.geo{margin:12px 18px 0;padding:10px 13px;border-radius:11px;display:flex;gap:9px;align-items:center;
  background:rgba(139,47,255,.08);border:1px solid var(--line);font-size:11px;line-height:1.45;color:#a99cc4}
.geo svg{width:15px;height:15px;flex:none;stroke:var(--purple-soft);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.geo b{color:var(--text);font-weight:700}
.srow s{color:#5d5273;margin-right:7px;font-size:12px}

/* ============ ДЕТАЛЬ ============ */
.gallery{position:relative;height:352px;overflow:hidden;background:#0a0417}
.gallery > *{width:100%;height:100%;display:block}
.gallery img{object-fit:cover}
.gallery::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,var(--bg) 2%,transparent 30%)}
.thumbs{display:flex;gap:9px;padding:0 18px;margin-top:-24px;position:relative;z-index:5}
.thumb{flex:1;height:70px;border-radius:12px;display:grid;place-items:center;padding:7px;overflow:hidden;
  background:#0b0518;border:1px solid var(--line);transition:.16s}
.thumb svg{height:100%;width:auto}
.thumb.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(245,200,66,.34) inset}
.dbody{padding:24px 18px 0}
.dbrand{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.dname{margin:0;font-family:"Playfair Display",serif;font-size:29px;font-weight:700;line-height:1.12}
.dmeta{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line);
  font-size:10.5px;font-weight:600;letter-spacing:.05em;color:#c6bade}
.chip.g{border-color:rgba(245,200,66,.34);color:var(--gold)}
.dprice{display:flex;align-items:baseline;gap:11px;margin:20px 0 4px}
.dprice b{font-size:29px;font-weight:800;letter-spacing:-.9px}
.dprice s{font-size:15px;color:#665b7d}
.dprice .off{padding:4px 8px;border-radius:7px;background:rgba(245,200,66,.16);color:var(--gold);font-size:11px;font-weight:800}
.dsec{margin-top:26px}
.dsec h3{margin:0 0 12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  font-weight:700;display:flex;align-items:center;gap:11px}
.dsec h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.dsec p{margin:0;font-size:13.5px;line-height:1.72;color:#bfb2d6}
.notes{display:flex;flex-direction:column;gap:11px}
.ngroup{padding:14px 15px;border-radius:13px;background:var(--card);border:1px solid var(--line);border-left:2px solid var(--gold)}
.ngroup b{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-weight:700;display:block;margin-bottom:7px}
.ngroup span{font-size:13px;line-height:1.6;color:#cdc1e2}
.disclaimer{margin-top:22px;padding:13px 15px;border-radius:12px;background:rgba(139,47,255,.07);
  border:1px solid var(--line);font-size:11px;line-height:1.62;color:#948aab}

/* ============ КНОПКИ / ЛИПКАЯ ПАНЕЛЬ ============ */
.sticky{position:sticky;bottom:14px;z-index:30;margin:26px 18px 0}
body.in-tg .sticky{display:none}          /* в Telegram вместо них нативная MainButton */
body.in-tg .screen{padding-bottom:22px}
body.in-tg .back{display:none}            /* назад — нативной BackButton */
.bigbtn{width:100%;padding:17px;border-radius:14px;background:linear-gradient(96deg,var(--purple),#6a1fd0);
  font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 14px 34px rgba(139,47,255,.45);transition:.16s}
.bigbtn:active{transform:scale(.98)}
.bigbtn.gold{background:linear-gradient(96deg,var(--gold),#dfa81c);color:#2a1a00;box-shadow:0 14px 34px rgba(245,200,66,.3)}
.bigbtn.ghost{background:var(--card);border:1px solid var(--line);box-shadow:none}
.bigbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ КОРЗИНА ============ */
.pad{padding:20px 18px 0}
.citem{display:flex;gap:13px;padding:12px;border-radius:15px;margin-bottom:11px;background:var(--card);border:1px solid var(--line)}
.cshot{width:74px;height:90px;border-radius:11px;flex:none;overflow:hidden;background:#0b0518}
.cshot > *{width:100%;height:100%;display:block;object-fit:cover}
.cinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.cinfo .nm{font-size:13px;font-weight:700;line-height:1.3}
.cinfo .vl{font-size:10.5px;color:var(--muted);margin-top:3px}
.crow{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:10px}
.qty{display:flex;align-items:center;background:#0b0518;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:30px;height:30px;display:grid;place-items:center;font-size:17px;font-weight:600;color:#c9bce0;transition:.14s}
.qty button:active{background:rgba(139,47,255,.3)}
.qty span{min-width:26px;text-align:center;font-size:13px;font-weight:800}
.cprice{font-size:14px;font-weight:800;white-space:nowrap}
.rm{font-size:10px;color:#665b7d;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.summary{margin:18px 18px 0;padding:16px;border-radius:15px;
  background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line)}
.srow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);padding:6px 0}
.srow.total{margin-top:9px;padding-top:14px;border-top:1px dashed rgba(139,47,255,.28);color:var(--text);font-size:14px;font-weight:700}
.srow.total b{font-size:23px;font-weight:800;letter-spacing:-.6px}
.empty{padding:80px 34px;text-align:center}
.empty svg{width:52px;height:52px;stroke:var(--purple);fill:none;stroke-width:1.3;opacity:.6;margin-bottom:18px}
.empty h3{margin:0 0 9px;font-family:"Playfair Display",serif;font-size:21px;font-weight:700}
.empty p{margin:0 0 24px;font-size:13px;color:var(--muted);line-height:1.6}

/* ============ ФОРМЫ ============ */
.field{margin-bottom:15px;padding:0 18px}
.field label{display:block;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.field input,.field textarea{width:100%;padding:15px;border-radius:12px;font-size:14px;color:var(--text);
  background:var(--card);border:1px solid var(--line);outline:none;transition:.16s;resize:none}
.field input::placeholder,.field textarea::placeholder{color:#5d5273}
.field input:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,47,255,.16)}
.field .err{font-size:11px;color:#ff7a9c;margin-top:7px;display:none}
.field.bad input,.field.bad textarea{border-color:#ff5c85}
.field.bad .err{display:block}

/* ============ ОПЛАТА ============ */
.paysum{margin:20px 18px 22px;padding:22px;border-radius:17px;text-align:center;
  background:linear-gradient(160deg,rgba(139,47,255,.2),var(--card));border:1px solid rgba(139,47,255,.3)}
.paysum small{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);font-weight:700}
.paysum b{display:block;margin-top:9px;font-size:38px;font-weight:800;letter-spacing:-1.3px;
  background:linear-gradient(96deg,var(--gold),#fff2c4 48%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.reqs{margin:0 18px;display:flex;flex-direction:column;gap:11px}
.req{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.req .rt{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.req .rt b{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:800}
.req .rt i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;
  background:rgba(139,47,255,.2);color:var(--purple-soft);font-size:10px;font-weight:800}
.rline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;font-size:13px}
.rline span{color:var(--muted);font-size:11.5px}
.rline b{font-weight:700;font-family:ui-monospace,SFMono-Regular,monospace;letter-spacing:.4px;font-size:13px}
.copy{font-size:9.5px;color:var(--gold);letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  padding:5px 8px;border:1px solid rgba(245,200,66,.3);border-radius:7px;transition:.14s}
.copy:active{background:rgba(245,200,66,.16)}
.tgbtn{width:100%;padding:16px;border-radius:14px;text-decoration:none;color:#fff;
  background:linear-gradient(96deg,#2aabee,#1d93d2);font-size:12px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 12px 30px rgba(42,171,238,.3);transition:.16s}
.tgbtn:active{transform:scale(.98)}
.tgbtn svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint{margin:16px 18px 0;font-size:11.5px;line-height:1.65;color:#8d83a4;text-align:center}

/* ============ УСПЕХ ============ */
.success{padding:56px 26px 0;text-align:center}
.tick{width:96px;height:96px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(139,47,255,.34),transparent 68%);
  border:1px solid rgba(245,200,66,.34);animation:pop .5s cubic-bezier(.22,1.3,.4,1)}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.tick svg{width:42px;height:42px;stroke:var(--gold);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.success h2{margin:0 0 12px;font-family:"Playfair Display",serif;font-size:28px;font-weight:700;line-height:1.16}
.success p{margin:0 auto;max-width:300px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.ordercard{margin:28px 0 0;padding:17px;border-radius:15px;text-align:left;background:var(--card);border:1px solid var(--line)}
.ordercard .rline b{font-family:Montserrat,sans-serif;font-size:12.5px;text-align:right}

.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,26px);z-index:80;
  padding:13px 20px;border-radius:12px;pointer-events:none;background:rgba(24,15,43,.97);
  border:1px solid rgba(245,200,66,.34);font-size:12px;font-weight:600;white-space:nowrap;
  opacity:0;transition:.26s cubic-bezier(.22,1.2,.4,1);box-shadow:0 12px 32px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
</style>
</head>
<body>
<div id="app"><div id="root"></div><div class="toast" id="toast"></div></div>

<script>
/* Product  = { id, name, brand, price, oldPrice?, volume, note, noteGroups?,
                description?, forWhom?, image, gallery?, fitContain?, category, badge? }
   CartItem = Product & { qty } */

/* Подставьте URL, чтобы заменить рисованный герой на фото. */
const HERO_IMAGE = null;

/* Реквизиты и контакты магазина */
const MANAGER_TG = 'https://t.me/Mirscents1';

/* ============ ОТПРАВКА ЗАКАЗА ============
   Токена бота здесь нет и быть не должно.
   ORDER_ENDPOINT — адрес order.php на вашем хостинге. Он проверяет подпись
   Telegram, сам собирает сообщение и отправляет его вам. Работает при любом
   способе запуска приложения.
   Если endpoint не задан, приложение попробует отдать заказ боту напрямую
   через sendData() — но это сработает, только когда Mini App открыт кнопкой
   обычной клавиатуры бота. */
const ORDER_ENDPOINT = 'mirscents.ch104825.tw1.ru';

/* ============ ДОСТАВКА: ЗОНЫ И ТАРИФЫ ============
   Отправка из Краснодара. Тариф — за одну коробку XS (до 1 кг),
   независимо от количества флаконов в заказе.
   Цены ориентировочные и НЕ включаются в сумму заказа: покупатель
   оплачивает товар, доставку согласует с менеджером.
   Чтобы поставить свои цены — правьте массивы prices/days ниже. */
const FROM_CITY = 'Краснодар';
const BOX = 'Коробка XS, до 1 кг';

const CARRIERS = [
  { id:'cdek', name:'СДЭК',          hint:'Пункт выдачи или курьер', color:'#0b9c48',
    prices:[300,390,520,650,790,950], days:[1,2,3,4,6,8] },
  { id:'ozon', name:'Ozon Доставка', hint:'Пункты выдачи Ozon',      color:'#0b57e0',
    prices:[250,320,430,550,670,820], days:[2,3,4,5,7,9] },
  { id:'post', name:'Почта России',  hint:'Отделение по адресу',     color:'#2a5caa',
    prices:[220,280,360,450,560,690], days:[3,5,7,9,12,16] }
];

/* Зоны считаются от Краснодара: чем дальше, тем выше номер. */
const ZONES = {
  1:['краснодар','сочи','адлер','новороссийск','анапа','геленджик','туапсе','армавир','ейск','крымск',
     'славянск-на-кубани','тихорецк','кропоткин','лабинск','майкоп','абинск','темрюк','апшеронск'],
  2:['ростов-на-дону','таганрог','шахты','новочеркасск','волгодонск','ставрополь','невинномысск','пятигорск',
     'кисловодск','ессентуки','минеральные воды','георгиевск','черкесск','нальчик','владикавказ','магас',
     'назрань','грозный','махачкала','дербент','каспийск','элиста','волгоград','волжский','астрахань',
     'симферополь','севастополь','ялта','керчь','евпатория','феодосия','сухум'],
  3:['москва','зеленоград','химки','мытищи','подольск','балашиха','королёв','королев','красногорск','люберцы',
     'одинцово','санкт-петербург','петербург','спб','пушкин','колпино','гатчина','всеволожск',
     'воронеж','липецк','тамбов','белгород','старый оскол','курск','орёл','орел','тула','рязань','калуга',
     'брянск','смоленск','тверь','ярославль','рыбинск','кострома','иваново','владимир','нижний новгород',
     'дзержинск','чебоксары','саранск','пенза','саратов','энгельс','ульяновск','казань','набережные челны',
     'самара','тольятти','сызрань','псков','великий новгород','вологда','череповец','калининград'],
  4:['екатеринбург','нижний тагил','каменск-уральский','челябинск','магнитогорск','миасс','златоуст','пермь',
     'березники','уфа','стерлитамак','салават','ижевск','киров','оренбург','орск','тюмень','тобольск','курган',
     'сургут','нижневартовск','ханты-мансийск','ноябрьск','новый уренгой','салехард','сыктывкар','ухта',
     'архангельск','северодвинск','мурманск','петрозаводск','нарьян-мар','воркута'],
  5:['омск','новосибирск','барнаул','бийск','рубцовск','кемерово','новокузнецк','томск','северск','красноярск',
     'ачинск','норильск','абакан','кызыл','иркутск','ангарск','братск','улан-удэ','чита'],
  6:['владивосток','уссурийск','находка','артём','артем','хабаровск','комсомольск-на-амуре','благовещенск',
     'биробиджан','якутск','нерюнгри','магадан','анадырь','петропавловск-камчатский','южно-сахалинск','холмск']
};
const ZONE_NAME={1:'Краснодарский край и Адыгея',2:'Юг России и Крым',3:'Центр и Северо-Запад',
  4:'Урал, Поволжье и Север',5:'Сибирь',6:'Дальний Восток'};
const DEFAULT_ZONE = 3;

/* Города по убыванию длины — чтобы «Нижний Новгород» не совпал с «Новгородом». */
const CITY_INDEX = Object.entries(ZONES)
  .flatMap(([z,list])=>list.map(c=>({city:c,zone:+z})))
  .sort((a,b)=>b.city.length-a.city.length);

function detectCity(addr){
  const a=(addr||'').toLowerCase();
  for(const e of CITY_INDEX) if(a.includes(e.city)) return e;
  return null;
}
function titleCase(c){ return c.split(/([ -])/).map(w=>w.length>2?w[0].toUpperCase()+w.slice(1):w).join(''); }

/* Ориентировочный тариф. Для боевых цен — заменить на запрос к вашему бэкенду:
   СДЭК   POST https://api.cdek.ru/v2/calculator/tariff
   Ozon   POST https://api-seller.ozon.ru/v1/delivery/calculate
   Почта  GET  https://tariff.pochta.ru/v2/calculate                          */
function quote(carrier, zone){
  const i=zone-1, d=carrier.days[i];
  return { price: carrier.prices[i], days: d+'–'+(d+2) };
}
const carrierById = id => CARRIERS.find(c=>c.id===id);

/* Ориентировочная стоимость доставки. В сумму заказа НЕ входит. */
function deliveryRaw(){
  if(S.delivery.status!=='ok') return null;
  return quote(carrierById(S.carrier), S.delivery.zone).price;
}
/* Покупатель оплачивает только товары. */
function orderTotal(){ return cartTotal(); }

/* ============ TELEGRAM MINI APP ============ */
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined
  ? window.Telegram.WebApp : null;
const TG_USER = tg && tg.initDataUnsafe ? (tg.initDataUnsafe.user || null) : null;

if(tg){
  document.body.classList.add('in-tg');
  tg.ready();
  tg.expand();
  /* Магазин остаётся тёмным при любой теме пользователя — это фирменный стиль.
     Красим окружение Telegram в тот же цвет, чтобы стыка не было видно. */
  try{ tg.setHeaderColor('#06000d'); tg.setBackgroundColor('#07000f'); }catch(e){}
  try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){}
  tg.BackButton.onClick(()=>onBack());
}
const buzz = t => { try{ tg && tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} };
const buzzOk = () => { try{ tg && tg.HapticFeedback.notificationOccurred('success'); }catch(e){} };

/* ============ СОСТОЯНИЕ ============ */
const S={screen:'shop',category:'мужские',productId:null,gIndex:0,cart:[],
  order:{fio:'',address:'',phone:''},touched:false,orderNo:null,paidTotal:0,paidQty:0,
  carrier:'cdek', delivery:{status:'idle',zone:0,city:''},
  sending:false, sent:null, chatId:''};
const $=id=>document.getElementById(id);
if(TG_USER) S.order.fio=[TG_USER.first_name,TG_USER.last_name].filter(Boolean).join(' ');
const money=n=>n.toLocaleString('ru-RU')+' ₽';
const cartCount=()=>S.cart.reduce((s,i)=>s+i.qty,0);
const cartTotal=()=>S.cart.reduce((s,i)=>s+i.price*i.qty,0);
const findP=id=>PRODUCTS.find(p=>p.id===id);
const listFor=c=>c==='акции'?PRODUCTS.filter(p=>p.oldPrice):PRODUCTS.filter(p=>p.category===c);
const plural=n=>{const a=Math.abs(n)%100,b=a%10;
  if(a>10&&a<20)return'товаров'; if(b>1&&b<5)return'товара'; if(b===1)return'товар'; return'товаров';};
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}
function go(s){S.screen=s;S.touched=false;render();window.scrollTo({top:0});}
function addToCart(id,e){ if(e) e.stopPropagation(); buzz('medium');
  const p=findP(id),ex=S.cart.find(i=>i.id===id);
  if(ex)ex.qty++; else S.cart.push({...p,qty:1});
  toast(p.name+' — в корзине'); render(); }
function setQty(id,d){const it=S.cart.find(i=>i.id===id);if(!it)return;
  it.qty+=d; if(it.qty<=0)S.cart=S.cart.filter(i=>i.id!==id); render();}
function removeItem(id){S.cart=S.cart.filter(i=>i.id!==id);render();}

const I={
  cart:'<svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>',
  arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  truck:'<svg viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>',
  shield:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V6z"/></svg>',
  tg:'<svg viewBox="0 0 24 24"><path d="M21.6 4.3 2.9 11.1c-.9.3-.9 1.6 0 1.9l4.7 1.5 1.8 5.5c.2.7 1.1.9 1.6.4l2.5-2.5 4.6 3.4c.6.4 1.4.1 1.6-.6l3-15.1c.2-.8-.6-1.5-1.1-1.3z"/><path d="m7.6 14.5 10.8-7.4-8 8.5"/></svg>',
  info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg>',
  geo:'<svg viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
  gem:'<svg viewBox="0 0 24 24"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18M9 3 6 9l6 12 6-12-3-6"/></svg>'
};

/* ============ ХЕДЕР ============ */
function header(){
  const titles={product:'Товар',cart:'Корзина',order:'Оформление',payment:'Оплата',success:'Готово'};
  const cartBtn = (S.screen==='cart'||S.screen==='success') ? '' :
    `<button class="iconbtn" aria-label="Корзина" onclick="go('cart')">${I.cart}
      ${cartCount()?`<i class="cbadge">${cartCount()}</i>`:''}</button>`;
  if(S.screen!=='shop')
    return `<header class="header"><div class="hrow">
      <button class="back" onclick="onBack()">${I.back}<span>${titles[S.screen]||'Назад'}</span></button>${cartBtn}</div></header>`;
  return `<header class="header">
    <div class="hrow"><div class="logo"><i>MIR</i> <b>SCENTS</b></div>${cartBtn}</div>
    <nav class="nav">${CATEGORIES.map(c=>
      `<button class="${c==='акции'?'sale ':''}${S.category===c?'on':''}" onclick="pickCat('${c}')">${c}</button>`).join('')}</nav>
  </header>`;
}
function onBack(){
  if(S.screen==='product'||S.screen==='cart')go('shop');
  else if(S.screen==='order')go('cart');
  else if(S.screen==='payment')go('order');
  else go('shop');
}
function pickCat(c){ S.category=c; buzz();
  if(S.screen!=='shop'){go('shop');}
  else{render();$('catalog')?.scrollIntoView({behavior:'smooth',block:'start'});}
}

/* ============ ЭКРАН: МАГАЗИН ============ */
function shopScreen(){
  const items=listFor(S.category);
  const heroP=['sauvage','br540','oudwood'].map(findP);
  return `<div class="screen">
    <section class="hero">
      <div class="hero-bg">${HERO_IMAGE?`<img src="${HERO_IMAGE}" alt="">`:heroScene(heroP)}</div>
      <div class="hero-veil"></div>
      <div class="hero-txt">
        <em>Премиальные ароматы</em>
        <h1>Премиальный<span>парфюм</span></h1>
        <button class="hero-cta" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">
          Перейти в каталог ${I.arrow}</button>
      </div>
    </section>

    <div class="trust">
      <div>${I.truck}<b>Быстрая доставка</b></div>
      <div>${I.shield}<b>Гарантия качества</b></div>
      <div>${I.gem}<b>Премиум качество</b></div>
    </div>

    <div class="sect" id="catalog">
      <div><em>Каталог ароматов</em><h2>${S.category}</h2></div>
      <span>${items.length} ${plural(items.length)}</span>
    </div>
    <div class="grid">${items.map(card).join('')}</div>
  </div>`;
}
function card(p){
  const inCart=S.cart.find(i=>i.id===p.id);
  return `<article class="pcard">
    <div onclick="openProduct('${p.id}')">
      <div class="pshot">
        ${p.badge?`<span class="badge ${p.oldPrice?'g':'p'}">${p.badge}</span>`:''}
        ${ImageWithFallback(p,0,'cover')}
      </div>
      <div class="pbody"><div class="ptext">
        <div class="pbrand">по мотивам ${p.brand}</div>
        <div class="pname">${p.name}</div>
        ${p.oldPrice?`<s class="pold">${money(p.oldPrice)}</s>`:''}
        <div class="pprice ${p.oldPrice?'sale':''}">${money(p.price)}</div>
      </div></div>
    </div>
    <button class="addbtn ${inCart?'done':''}" onclick="addToCart('${p.id}',event)">
      ${inCart?I.check+' В корзине · '+inCart.qty:I.cart+' В корзину'}</button>
  </article>`;
}
function openProduct(id){S.productId=id;S.gIndex=0;go('product');}

/* ============ ЭКРАН: ДЕТАЛЬ ============ */
function productScreen(){
  const p=findP(S.productId), inCart=S.cart.find(i=>i.id===p.id);
  const off=p.oldPrice?Math.round((1-p.price/p.oldPrice)*100):0;
  return `<div class="screen">
    <div class="gallery">${ImageWithFallback(p,S.gIndex,'cover')}</div>
    <div class="thumbs">${[0,1,2].map(i=>
      `<button class="thumb ${i===S.gIndex?'on':''}" onclick="S.gIndex=${i};render()">${art(p.art,i)}</button>`).join('')}</div>
    <div class="dbody">
      <div class="dbrand">по мотивам ${p.brand}</div>
      <h1 class="dname">${p.name}</h1>
      <div class="dmeta"><span class="chip">${p.volume}</span><span class="chip g">${p.forWhom}</span><span class="chip">${p.note}</span></div>
      <div class="dprice"><b>${money(p.price)}</b>${p.oldPrice?`<s>${money(p.oldPrice)}</s><span class="off">−${off}%</span>`:''}</div>
      <div class="dsec"><h3>Пирамида аромата</h3><div class="notes">
        <div class="ngroup"><b>Верхние ноты</b><span>${p.noteGroups.top}</span></div>
        <div class="ngroup"><b>Ноты сердца</b><span>${p.noteGroups.heart}</span></div>
        <div class="ngroup"><b>Базовые ноты</b><span>${p.noteGroups.base}</span></div></div></div>
      <div class="dsec"><h3>Описание</h3><p>${p.description}</p></div>
      <div class="disclaimer">Самостоятельная парфюмерная композиция, созданная по мотивам известного аромата.
        Не является товаром бренда ${p.brand} и не связана с правообладателем.</div>
    </div>
    <div class="sticky"><button class="bigbtn ${inCart?'gold':''}" onclick="addToCart('${p.id}')">
      ${inCart?I.check+' В корзине · '+inCart.qty+' шт':I.plus+' Добавить в корзину'}</button></div>
  </div>`;
}

/* ============ ЭКРАН: КОРЗИНА ============ */
function cartScreen(){
  if(!S.cart.length) return `<div class="screen"><div class="empty">${I.cart}
    <h3>В корзине пусто</h3><p>Выберите аромат в каталоге — он появится здесь.</p>
    <button class="bigbtn" onclick="go('shop')">Открыть каталог ${I.arrow}</button></div></div>`;
  return `<div class="screen">
    <div class="pad">${S.cart.map(it=>`
      <div class="citem">
        <div class="cshot">${ImageWithFallback(it,0,'cover')}</div>
        <div class="cinfo">
          <div class="pbrand">по мотивам ${it.brand}</div>
          <div class="nm">${it.name}</div>
          <div class="vl">${it.volume} · <button class="rm" onclick="removeItem('${it.id}')">Удалить</button></div>
          <div class="crow">
            <div class="qty"><button onclick="setQty('${it.id}',-1)" aria-label="Меньше">−</button>
              <span>${it.qty}</span><button onclick="setQty('${it.id}',1)" aria-label="Больше">+</button></div>
            <div class="cprice">${money(it.price*it.qty)}</div></div>
        </div></div>`).join('')}</div>
    <div class="summary">
      <div class="srow"><span>Товары, ${cartCount()} шт</span><span>${money(cartTotal())}</span></div>
      <div class="srow"><span>Доставка</span><span style="color:#8d83a4">оплачивается отдельно</span></div>
      <div class="srow total"><span>Итого</span><b>${money(cartTotal())}</b></div></div>
    <p class="hint">Ориентировочную стоимость доставки покажем на следующем шаге, когда вы укажете адрес.</p>
    <div class="sticky"><button class="bigbtn" onclick="go('order')">Оформить заказ ${I.arrow}</button></div>
  </div>`;
}

/* ============ ЭКРАН: ЗАКАЗ ============ */
function orderScreen(){
  if(S.delivery.status==='idle' && S.order.address.trim().length>=8) runQuote(true);
  const o=S.order,t=S.touched;
  const bad={fio:t&&o.fio.trim().length<3,address:t&&o.address.trim().length<8,phone:t&&o.phone.replace(/\D/g,'').length<10};
  return `<div class="screen">
    <div class="sect"><div><em>Шаг 1 из 2</em><h2>Куда доставить</h2></div></div>
    <div class="field ${bad.fio?'bad':''}"><label for="f-fio">ФИО получателя</label>
      <input id="f-fio" value="${o.fio}" placeholder="Иванов Иван Иванович" oninput="S.order.fio=this.value" autocomplete="name">
      <div class="err">Укажите фамилию, имя и отчество</div></div>
    <div class="field ${bad.address?'bad':''}"><label for="f-addr">Полный адрес доставки</label>
      <textarea id="f-addr" rows="3" placeholder="Город, улица, дом, квартира, индекс"
        oninput="onAddress(this.value)" autocomplete="street-address">${o.address}</textarea>
      <div class="err">Нужен адрес с городом, улицей и домом</div></div>
    <div class="field ${bad.phone?'bad':''}"><label for="f-tel">Телефон</label>
      <input id="f-tel" value="${o.phone}" placeholder="+7 (900) 000-00-00" inputmode="tel" oninput="S.order.phone=this.value" autocomplete="tel">
      <div class="err">Введите номер из 10 цифр</div></div>

    <div id="calc">${calcHTML()}</div>

    <div class="sticky"><button class="bigbtn" onclick="submitOrder()">Перейти к оплате ${I.arrow}</button></div>
  </div>`;
}

/* Блок «Доставка» — перерисовывается отдельно, чтобы не сбивать курсор в адресе */
function calcHTML(){
  const st=S.delivery.status;
  const rows=CARRIERS.map(c=>{
    let cls='pr wait', main='Укажите адрес', sub='';
    if(st==='loading'){ cls='pr wait load'; main='Расчёт…'; }
    else if(st==='ok'){ const q=quote(c,S.delivery.zone); cls='pr'; main='≈ '+money(q.price); sub=q.days+' дн'; }
    return `<button class="carrier ${S.carrier===c.id?'on':''}" onclick="pickCarrier('${c.id}')">
      <span class="mark" style="background:${c.color}">${c.id==='cdek'?'СДЭК':c.id==='ozon'?'OZON':'ПОЧТА'}</span>
      <span class="tx"><b>${c.name}</b><span>${c.hint}</span></span>
      <span class="${cls}"><b>${main}</b>${sub?`<span>${sub}</span>`:''}</span>
    </button>`;}).join('');

  let geo='';
  if(st==='loading') geo=`<div class="geo">${I.geo}<span>Определяем населённый пункт…</span></div>`;
  else if(st==='ok'&&S.delivery.city)
    geo=`<div class="geo">${I.geo}<span>${FROM_CITY} → <b>${S.delivery.city}</b> · зона ${S.delivery.zone}, ${ZONE_NAME[S.delivery.zone]} · ${BOX}</span></div>`;
  else if(st==='ok')
    geo=`<div class="geo">${I.geo}<span>Город не распознан — показываем тариф по зоне ${DEFAULT_ZONE}. Уточните населённый пункт в адресе.</span></div>`;

  return `<div class="sect" style="padding-top:24px"><div><em>Шаг 2 из 2</em><h2>Доставка</h2></div>
      <span>из ${FROM_CITY}а</span></div>
    <div class="carriers">${rows}</div>
    ${geo}
    <div class="notice">${I.info}<span><b>Сумма доставки указана примерно.</b>
      Точную стоимость уточните у менеджера — она зависит от габаритов, тарифа перевозчика на день отправки
      и выбранного пункта выдачи.</span></div>

    <div class="summary">
      <div class="srow"><span>Товары, ${cartCount()} шт</span><span>${money(cartTotal())}</span></div>
      <div class="srow"><span>Доставка · ${carrierById(S.carrier).name}</span>
        <span style="color:#8d83a4">оплачивается отдельно</span></div>
      <div class="srow total"><span>К оплате сейчас</span><b>${money(orderTotal())}</b></div>
    </div>
    <p class="hint">Оплатите стоимость товаров. После оплаты напишите менеджеру —
      он назовёт точную сумму доставки и оформит отправку.</p>`;
}

let addrT;
function onAddress(v){
  S.order.address=v;
  const ready=v.trim().length>=8;
  S.delivery.status = ready?'loading':'idle';
  renderCalc();
  clearTimeout(addrT);
  if(ready) addrT=setTimeout(()=>runQuote(),650);
}
function runQuote(silent){
  const e=detectCity(S.order.address);
  S.delivery={status:'ok', zone:e?e.zone:DEFAULT_ZONE, city:e?titleCase(e.city):''};
  if(!silent) renderCalc();
}
function pickCarrier(id){ S.carrier=id; buzz(); renderCalc(); }
function renderCalc(){ const el=$('calc'); if(el) el.innerHTML=calcHTML(); }

function submitOrder(){
  S.touched=true; const o=S.order;
  const ok=o.fio.trim().length>=3&&o.address.trim().length>=8&&o.phone.replace(/\D/g,'').length>=10;
  if(!ok){render();toast('Заполните выделенные поля');return;}
  if(S.delivery.status!=='ok'){ runQuote(); }
  S.orderNo='MS-'+String(Math.floor(Math.random()*9000)+1000); go('payment');
}

/* ============ ЭКРАН: ОПЛАТА ============ */
function payScreen(){
  const total=orderTotal(), c=carrierById(S.carrier);
  return `<div class="screen">
    <div class="paysum"><small>Сумма заказа ${S.orderNo}</small><b>${money(total)}</b>
      <div style="margin-top:11px;font-size:11px;color:var(--muted);letter-spacing:.04em">
        Только товары · доставка ${c.name} оплачивается отдельно</div></div>
    <div class="reqs">
      <div class="req"><div class="rt"><i>СБП</i><b>Система быстрых платежей</b></div>
        <div class="rline"><span>Номер телефона</span><b id="r1">${PAY.phone}</b>
          <button class="copy" onclick="copyVal('r1')">Копировать</button></div>
        <div class="rline"><span>Получатель</span><b>${PAY.name}</b></div>
        <div class="rline"><span>Банк</span><b>${PAY.banks}</b></div></div></div>

    <div class="notice">${I.info}<span>Комментарий к переводу оставьте пустым — указывать ничего не нужно.
      Ваш номер заказа <b>${S.orderNo}</b>, назовите его менеджеру.</span></div>

    <div class="notice">${I.info}<span>Доставка в сумму не входит. Менеджер назовёт
      точную стоимость ${c.name}${deliveryRaw()!==null?` (примерно ${money(deliveryRaw())})`:''} отдельно.</span></div>

    <p class="hint">После перевода напишите менеджеру номер заказа — он подтвердит оплату и оформит отправку.</p>
    <div style="padding:14px 18px 0"><a class="tgbtn" href="${MANAGER_TG}" target="_blank" rel="noopener" onclick="openManager(event)">
      ${I.tg} Написать менеджеру</a></div>

    <div class="sticky"><button class="bigbtn gold" onclick="paid()" ${S.sending?'disabled':''}>
      ${S.sending?'Отправляем заказ…':I.lock+' Я оплатил'}</button></div>
  </div>`;
}
function copyVal(id){const v=$(id).textContent.trim();
  navigator.clipboard?.writeText(v).then(()=>toast('Скопировано')).catch(()=>toast(v));}
async function paid(){
  if(S.sending) return;
  S.sending=true; render();
  const ok=await sendOrder();                 // собираем письмо ДО очистки корзины
  S.sending=false; S.sent=ok; if(ok) buzzOk();
  S.paidTotal=orderTotal(); S.paidQty=cartCount();
  S.paidCarrier=carrierById(S.carrier).name; S.paidShip=deliveryRaw();
  S.cart=[]; go('success');
}


/* ============ ОТПРАВКА ЗАКАЗА ============ */
function orderPayload(){
  return {
    initData: tg ? tg.initData : '',
    orderNo: S.orderNo,
    customer: {...S.order},
    tgUser: TG_USER ? {id:TG_USER.id, username:TG_USER.username||'',
                       name:[TG_USER.first_name,TG_USER.last_name].filter(Boolean).join(' ')} : null,
    items: S.cart.map(i=>({brand:i.brand,name:i.name,volume:i.volume,price:i.price,qty:i.qty})),
    total: cartTotal(), carrier: S.carrier, delivery: deliveryRaw(),
    zone: S.delivery.zone, city: S.delivery.city
  };
}

async function sendOrder(){
  const payload=orderPayload();

  /* Основной путь: свой обработчик. Работает при любом способе запуска. */
  if(ORDER_ENDPOINT){
    try{
      const r=await fetch(ORDER_ENDPOINT,{method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||j.ok===false) console.error('MIR SCENTS · обработчик отклонил:',r.status,j.error||'');
      return r.ok && j.ok!==false;
    }catch(e){ console.error('MIR SCENTS · обработчик недоступен:',e.message); return false; }
  }

  /* Запасной путь: отдать боту напрямую. Приложение при этом закроется.
     Работает, только если Mini App открыт кнопкой обычной клавиатуры бота. */
  if(tg && typeof tg.sendData==='function'){
    try{ tg.sendData(JSON.stringify(payload)); return true; }
    catch(e){ console.error('MIR SCENTS · sendData не сработал:',e.message); return false; }
  }

  console.error('MIR SCENTS · не задан ORDER_ENDPOINT и недоступен sendData');
  return false;
}

/* ============ ЭКРАН: УСПЕХ ============ */
function successScreen(){
  return `<div class="screen"><div class="success">
    <div class="tick">${I.check}</div>
    <h2>Заказ ${S.orderNo} принят</h2>
    <p>Напишите менеджеру номер заказа — он подтвердит оплату, назовёт точную стоимость доставки
      и пришлёт трек-номер.</p>
    <div class="ordercard">
      <div class="rline"><span>Получатель</span><b>${S.order.fio}</b></div>
      <div class="rline"><span>Телефон</span><b>${S.order.phone}</b></div>
      <div class="rline"><span>Адрес</span><b style="max-width:190px">${S.order.address}</b></div>
      <div class="rline"><span>Доставка</span><b>${S.paidCarrier}${S.paidShip!==null?' · ≈ '+money(S.paidShip):''}</b></div>
      <div class="rline"><span>Товаров</span><b>${S.paidQty} шт</b></div>
      <div class="rline"><span>Оплачено за товары</span><b style="color:var(--gold)">${money(S.paidTotal)}</b></div></div>
    <div class="notice" style="margin:14px 0 0;text-align:left">${I.info}<span>Доставка ещё не оплачена —
      точную сумму назовёт менеджер.</span></div>
    ${S.sent===false?`<div class="notice" style="margin:11px 0 0;text-align:left;
      background:rgba(255,92,133,.09);border-color:rgba(255,92,133,.3);color:#f0b8c6">${I.info}<span>
      Заказ не удалось передать автоматически. <b>Напишите менеджеру номер ${S.orderNo}</b> — данные не потеряются.
      </span></div>`:''}
    <div style="margin-top:20px"><a class="tgbtn" href="${MANAGER_TG}" target="_blank" rel="noopener" onclick="openManager(event)">
      ${I.tg} Написать менеджеру · ${S.orderNo}</a></div>
    <div class="sticky" style="margin-left:0;margin-right:0">
      <button class="bigbtn ghost" onclick="resetShop()">Вернуться в магазин</button></div>
  </div></div>`;
}
function resetShop(){S.order={fio:'',address:'',phone:''};S.orderNo=null;S.sent=null;
  S.delivery={status:'idle',zone:0,city:''};S.carrier='cdek';go('shop');}

/* ============ НАТИВНЫЕ КНОПКИ TELEGRAM ============ */
let mbHandler=null;
function mbShow(text,handler,gold){
  const mb=tg.MainButton;
  if(mbHandler) mb.offClick(mbHandler);
  mbHandler=handler; mb.onClick(mbHandler);
  mb.setParams({text, color: gold?'#f5c842':'#8b2fff', text_color: gold?'#2a1a00':'#ffffff'});
  mb.enable(); mb.show();
}
function mbHide(){
  const mb=tg.MainButton;
  if(mbHandler){ mb.offClick(mbHandler); mbHandler=null; }
  mb.hide();
}
function syncTgUI(){
  if(!tg) return;

  /* Назад */
  if(S.screen==='shop'||S.screen==='success') tg.BackButton.hide();
  else tg.BackButton.show();

  /* Не даём случайно смахнуть приложение с непустой корзиной */
  try{ S.cart.length ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation(); }catch(e){}

  if(S.sending){ tg.MainButton.showProgress(); return; }
  tg.MainButton.hideProgress();

  switch(S.screen){
    case 'shop':
      if(!S.cart.length) return mbHide();
      return mbShow(`Корзина · ${cartCount()} шт · ${money(cartTotal())}`, ()=>{buzz();go('cart');});
    case 'product': {
      const p=findP(S.productId), it=S.cart.find(i=>i.id===p.id);
      return mbShow(it?`В корзине · ${it.qty} шт · добавить ещё`:'Добавить в корзину',
        ()=>addToCart(p.id), !!it);
    }
    case 'cart':
      if(!S.cart.length) return mbHide();
      return mbShow('Оформить заказ', ()=>{buzz();go('order');});
    case 'order':   return mbShow('Перейти к оплате', ()=>{buzz();submitOrder();});
    case 'payment': return mbShow('Я оплатил', ()=>paid(), true);
    case 'success': return mbShow('Вернуться в магазин', ()=>{buzz();resetShop();});
  }
}

/* Ссылки t.me внутри Telegram открываем нативно, а не новой вкладкой */
function openManager(e){
  if(tg){ e.preventDefault(); buzz(); tg.openTelegramLink(MANAGER_TG); }
}

/* ============ РЕНДЕР ============ */
function render(){
  const body={shop:shopScreen,product:productScreen,cart:cartScreen,
    order:orderScreen,payment:payScreen,success:successScreen}[S.screen]();
  const f=document.activeElement?.id, pos=document.activeElement?.selectionStart;
  $('root').innerHTML=header()+body;
  syncTgUI();
  if(f&&$(f)){const el=$(f);el.focus();try{el.setSelectionRange(pos,pos);}catch(e){}}
}
render();
</script>
</body>
</html>
